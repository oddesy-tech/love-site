<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  background:radial-gradient(circle,#5b0038,#160016 70%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
}

.box{
  text-align:center;
  position:relative;
  z-index:10;
}

h1{
  color:white;
  font-size:clamp(45px,12vw,100px);
  text-shadow:
    0 0 10px #ff0066,
    0 0 30px #ff0066,
    0 8px 0 #8b003d;
  animation:pulse 1.5s infinite;
}

.heart{
  font-size:100px;
  margin-top:20px;
  filter:drop-shadow(0 0 25px #ff0066);
  animation:heart 2s infinite;
}

p{
  color:#ffd6e8;
  margin-top:20px;
  letter-spacing:4px;
}

@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}

@keyframes heart{
  0%,100%{
    transform:rotateY(-15deg) scale(1);
  }
  50%{
    transform:rotateY(15deg) scale(1.2);
  }
}

.rose{
  position:absolute;
  top:-60px;
  font-size:35px;
  animation:fall linear forwards;
}

@keyframes fall{
  from{
    transform:translateY(-60px) rotate(0deg);
    opacity:0;
  }

  10%{
    opacity:1;
  }

  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

.petal{
  position:absolute;
  top:-30px;
  width:13px;
  height:20px;
  background:#ff397d;
  border-radius:100% 0 100% 0;
  box-shadow:0 0 10px #ff397d;
  animation:petalFall linear forwards;
}

@keyframes petalFall{
  from{
    transform:translateY(-30px) rotate(0);
  }

  to{
    transform:translateY(110vh) translateX(100px) rotate(500deg);
  }
}
</style>
</head>

<body>

<div class="box">
  <h1>I LOVE YOU</h1>
  <div class="heart">❤️</div>
  <p>FOREVER & ALWAYS</p>
</div>

<script>

function rose(){

  let r=document.createElement("div");

  r.className="rose";
  r.innerHTML="🌹";

  r.style.left=Math.random()*100+"vw";

  r.style.fontSize=
    (25+Math.random()*30)+"px";

  r.style.animationDuration=
    (4+Math.random()*5)+"s";

  document.body.appendChild(r);

  setTimeout(()=>{
    r.remove();
  },9000);
}
