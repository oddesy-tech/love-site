<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Love ❤️</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(circle at 50% 42%,#650018 0%,#26000b 35%,#050006 75%);
  font-family:Georgia,serif;
  color:white;
}

.scene{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1000px;
  overflow:hidden;
}

/* background glow */
.glow{
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;
  background:#ff1744;
  filter:blur(100px);
  opacity:.28;
  animation:glow 4s ease-in-out infinite alternate;
}

@keyframes glow{
  from{transform:scale(.75);opacity:.18}
  to{transform:scale(1.2);opacity:.4}
}

/* 3D rose */
.rose-wrap{
  position:relative;
  width:220px;
  height:360px;
  transform-style:preserve-3d;
  animation:roseFloat 4s ease-in-out infinite;
}

.rose{
  position:absolute;
  width:190px;
  height:190px;
  left:15px;
  top:10px;
  transform-style:preserve-3d;
  animation:roseRotate 18s linear infinite;
}

.petal{
  position:absolute;
  width:95px;
  height:125px;
  left:47px;
  top:32px;
  border-radius:72% 28% 68% 32%;
  background:
    radial-gradient(circle at 30% 25%,#ff7187 0%,#e80032 30%,#9b001e 70%,#45000d 100%);
  box-shadow:
    inset -12px -15px 20px rgba(40,0,8,.55),
    inset 8px 5px 15px rgba(255,130,145,.3),
    0 5px 18px rgba(255,0,55,.3);
  transform-origin:50% 100%;
}

/* many layers create depth */
.p1{transform:rotateY(0deg) rotateZ(0deg) translateZ(25px)}
.p2{transform:rotateY(45deg) rotateZ(42deg) translateZ(18px)}
.p3{transform:rotateY(90deg) rotateZ(84deg) translateZ(12px)}
.p4{transform:rotateY(135deg) rotateZ(126deg) translateZ(8px)}
.p5{transform:rotateY(180deg) rotateZ(168deg) translateZ(5px)}
.p6{transform:rotateY(225deg) rotateZ(210deg) translateZ(8px)}
.p7{transform:rotateY(270deg) rotateZ(252deg) translateZ(12px)}
.p8{transform:rotateY(315deg) rotateZ(294deg) translateZ(18px)}
.p9{transform:rotateY(30deg) rotateZ(18deg) scale(.78) translateZ(38px)}
.p10{transform:rotateY(150deg) rotateZ(138deg) scale(.72) translateZ(45px)}
.p11{transform:rotateY(270deg) rotateZ(258deg) scale(.68) translateZ(50px)}

.rose-center{
  position:absolute;
  width:58px;
  height:58px;
  left:66px;
  top:67px;
  border-radius:50%;
  z-index:20;
  background:
    radial-gradient(circle at 35% 30%,#ff9aaa,#d4002e 45%,#650014 90%);
  box-shadow:
    inset -7px -8px 10px #52000f,
    0 0 20px #ff1744;
  animation:centerPulse 2s ease-in-out infinite;
}

@keyframes centerPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

@keyframes roseRotate{
  0%{transform:rotateY(0deg) rotateZ(-2deg)}
  50%{transform:rotateY(180deg) rotateZ(3deg)}
  100%{transform:rotateY(360deg) rotateZ(-2deg)}
}

@keyframes roseFloat{
  0%,100%{transform:translateY(10px) rotateX(3deg)}
  50%{transform:translateY(-18px) rotateX(-4deg)}
}

/* stem */
.stem{
  position:absolute;
  width:14px;
  height:180px;
  background:linear-gradient(90deg,#123b14,#319638,#0c2b0f);
  left:103px;
  top:150px;
  border-radius:20px;
  transform:rotate(3deg);
  box-shadow:4px 0 10px rgba(0,0,0,.5);
}

/* leaves */
.leaf{
  position:absolute;
  width:72px;
  height:38px;
  background:linear-gradient(135deg,#54bd55,#0b4813);
  border-radius:100% 0 100% 0;
}

.leaf1{
  left:42px;
  top:235px;
  transform:rotate(-25deg);
}

.leaf2{
  left:108px;
  top:275px;
  transform:rotate(25deg) scaleX(-1);
}

/* falling petals */
.fall{
  position:absolute;
  top:-60px;
  font-size:22px;
  animation:fall linear infinite;
  z-index:2;
}

@keyframes fall{
  0%{
    transform:translate3d(0,-60px,0) rotate(0);
  }
  100%{
    transform:translate3d(80px,110vh,0) rotate(720deg);
  }
}

/* text */
.content{
  position:absolute;
  z-index:10;
  text-align:center;
  top:53%;
  width:100%;
  pointer-events:none;
}

h1{
  margin:0;
  font-size:clamp(42px,12vw,85px);
  text-shadow:
    0 0 8px #ff1744,
    0 0 25px #ff1744,
    0 0 50px #ff1744;
  animation:heartbeat 1.8s infinite;
}

.love{
  margin-top:8px;
  font-size:clamp(20px,5vw,34px);
  letter-spacing:6px;
  color:#ffd0d8;
  text-shadow:0 0 18px #ff1744;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.06)}
  30%{transform:scale(1)}
  45%{transform:scale(1.04)}
}

/* stars */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 8px white;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="scene">

  <div class="glow"></div>

  <!-- falling roses -->
  <span class="fall" style="left:5%;animation-duration:7s">🌹</span>
  <span class="fall" style="left:18%;animation-duration:9s;animation-delay:2s">🌸</span>
  <span class="fall" style="left:32%;animation-duration:6s;animation-delay:1s">🌹</span>
  <span class="fall" style="left:50%;animation-duration:8s;animation-delay:3s">🌸</span>
  <span class="fall" style="left:68%;animation-duration:7s;animation-delay:1s">🌹</span>
  <span class="fall" style="left:84%;animation-duration:10s;animation-delay:2s">🌸</span>
  <span class="fall" style="left:95%;animation-duration:6s">🌹</span>

  <!-- stars -->
  <span class="star" style="left:12%;top:18%"></span>
  <span class="star" style="left:25%;top:30%"></span>
  <span class="star" style="left:75%;top:22%"></span>
  <span class="star" style="left:88%;top:38%"></span>
  <span class="star" style="left:55%;top:12%"></span>

  <!-- 3D rose -->
  <div class="rose-wrap">

    <div class="rose">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="petal p9"></div>
      <div class="petal p10"></div>
      <div class="petal p11"></div>
      <div class="rose-center"></div>
    </div>

    <div class="stem"></div>
    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>

  </div>

  <div class="content">
    <h1>Rose Love ❤️</h1>
    <div class="love">I LOVE YOU</div>
  </div>

</div>

</body>
</html>
