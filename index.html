<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Love ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(circle at center,#650018 0%,#25000b 40%,#030003 100%);
  font-family:Georgia,serif;
  color:white;
}

.scene{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1000px;
}

/* background glow */
.glow{
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;
  background:#ff1744;
  filter:blur(100px);
  opacity:.28;
  animation:glow 4s ease-in-out infinite alternate;
}

@keyframes glow{
  from{transform:scale(.75);opacity:.18}
  to{transform:scale(1.2);opacity:.42}
}

/* glowing heart orbit */
.orbit{
  position:absolute;
  width:330px;
  height:330px;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  animation:orbit 12s linear infinite;
  z-index:4;
  pointer-events:none;
}

.orbit span{
  position:absolute;
  font-size:23px;
  filter:drop-shadow(0 0 10px #ff1744);
}

.orbit span:nth-child(1){
  left:50%;
  top:0;
}

.orbit span:nth-child(2){
  right:0;
  top:50%;
}

.orbit span:nth-child(3){
  left:50%;
  bottom:0;
}

.orbit span:nth-child(4){
  left:0;
  top:50%;
}

@keyframes orbit{
  from{
    transform:translate(-50%,-50%) rotate(0deg);
  }
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

/* 3D rose */
.rose-wrap{
  position:absolute;
  width:230px;
  height:370px;
  top:18%;
  transform-style:preserve-3d;
  animation:floatRose 4s ease-in-out infinite;
  z-index:6;
}

.rose{
  position:absolute;
  width:200px;
  height:200px;
  left:15px;
  top:0;
  transform-style:preserve-3d;
  animation:rotateRose 18s linear infinite;
}

.petal{
  position:absolute;
  width:100px;
  height:130px;
  left:50px;
  top:32px;
  border-radius:72% 28% 68% 32%;
  background:
    radial-gradient(circle at 30% 20%,
    #ff8195 0%,
    #f00035 28%,
    #a50022 65%,
    #43000d 100%);
  box-shadow:
    inset -12px -15px 20px rgba(35,0,8,.55),
    inset 8px 5px 15px rgba(255,150,165,.3),
    0 5px 20px rgba(255,0,55,.35);
  transform-origin:50% 100%;
}

.p1{transform:rotateZ(0deg) translateZ(25px)}
.p2{transform:rotateZ(45deg) translateZ(20px)}
.p3{transform:rotateZ(90deg) translateZ(15px)}
.p4{transform:rotateZ(135deg) translateZ(10px)}
.p5{transform:rotateZ(180deg) translateZ(8px)}
.p6{transform:rotateZ(225deg) translateZ(10px)}
.p7{transform:rotateZ(270deg) translateZ(15px)}
.p8{transform:rotateZ(315deg) translateZ(20px)}

.p9{
  transform:rotateZ(25deg) scale(.75) translateZ(38px);
}

.p10{
  transform:rotateZ(155deg) scale(.7) translateZ(45px);
}

.p11{
  transform:rotateZ(285deg) scale(.65) translateZ(50px);
}

.rose-center{
  position:absolute;
  width:62px;
  height:62px;
  left:69px;
  top:69px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,
    #ff9baa,
    #d50030 45%,
    #600012 90%);
  box-shadow:
    inset -8px -8px 12px #50000f,
    0 0 25px #ff1744;
  z-index:20;
  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

@keyframes rotateRose{
  0%{transform:rotateY(0deg) rotateZ(-2deg)}
  50%{transform:rotateY(180deg) rotateZ(3deg)}
  100%{transform:rotateY(360deg) rotateZ(-2deg)}
}

@keyframes floatRose{
  0%,100%{transform:translateY(10px)}
  50%{transform:translateY(-18px)}
}

/* stem */
.stem{
  position:absolute;
  width:14px;
  height:190px;
  left:108px;
  top:155px;
  border-radius:20px;
  background:linear-gradient(
    90deg,#09240c,#319b3a,#0b2e10
  );
  transform:rotate(3deg);
}

/* leaves */
.leaf{
  position:absolute;
  width:75px;
  height:40px;
  background:linear-gradient(135deg,#59c45a,#0a4712);
  border-radius:100% 0 100% 0;
}

.leaf1{
  left:42px;
  top:245px;
  transform:rotate(-25deg);
}

.leaf2{
  left:112px;
  top:280px;
  transform:rotate(25deg) scaleX(-1);
}

/* falling flowers */
.fall{
  position:absolute;
  top:-60px;
  font-size:24px;
  z-index:3;
  animation:fall linear infinite;
}

@keyframes fall{
  0%{
    transform:translateY(-60px) rotate(0deg);
  }
  100%{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* text */
.content{
  position:absolute;
  z-index:10;
  top:65%;
  width:100%;
  text-align:center;
}

h1{
  margin:0;
  font-size:clamp(42px,12vw,85px);
  text-shadow:
    0 0 10px #ff1744,
    0 0 25px #ff1744,
    0 0 55px #ff1744;
  animation:heartbeat 1.7s infinite;
}

.love{
  margin-top:8px;
  font-size:clamp(20px,5vw,34px);
  letter-spacing:6px;
  color:#ffd0d8;
  text-shadow:0 0 18px #ff1744;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.06)}
  30%{transform:scale(1)}
  45%{transform:scale(1.04)}
}

/* small stars */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 8px white;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="scene">

  <div class="glow"></div>

  <div class="orbit">
    <span>❤️</span>
    <span>💗</span>
    <span>❤️</span>
    <span>💖</span>
  </div>

  <!-- falling flowers -->
  <span class="fall" style="left:5%;animation-duration:7s">🌹</span>
  <span class="fall" style="left:18%;animation-duration:9s;animation-delay:2s">🌸</span>
  <span class="fall" style="left:32%;animation-duration:6s;animation-delay:1s">🌹</span>
  <span class="fall" style="left:50%;animation-duration:8s;animation-delay:3s">🌸</span>
  <span class="fall" style="left:68%;animation-duration:7s;animation-delay:1s">🌹</span>
  <span class="fall" style="left:84%;animation-duration:10s;animation-delay:2s">🌸</span>
  <span class="fall" style="left:95%;animation-duration:6s">🌹</span>

  <!-- stars -->
  <span class="star" style="left:12%;top:18%"></span>
  <span class="star" style="left:25%;top:30%"></span>
  <span class="star" style="left:75%;top:22%"></span>
  <span class="star" style="left:88%;top:38%"></span>
  <span class="star" style="left:55%;top:12%"></span>

  <!-- rose -->
  <div class="rose-wrap">

    <div class="rose">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="petal p9"></div>
      <div class="petal p10"></div>
      <div class="petal p11"></div>
      <div class="rose-center"></div>
    </div>

    <div class="stem"></div>
    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>

  </div>

  <div class="content">
    <h1>Rose Love ❤️</h1>
    <div class="love">I LOVE YOU</div>
  </div>

</div>

</body>
</html>
